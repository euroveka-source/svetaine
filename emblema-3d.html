<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// "tamsus"    – tamsiai žalias fonas, blizgi emblema su atspindžiu grindyse, šviesos perbėgimas
// "surinkimas" – kreminis fonas, emblema susirenka dalimis: diskas, vežimėlis, ratai, VK, raidės
// "konturas"  – Viollos scenarijus: pirma vežimėlio kontūras, tada diskas, tada užrašas; kreminis fonas, šviesesnės spalvos
const VARIANT = "konturas";
const TAMSUS = VARIANT === "tamsus";
const KONTURAS = VARIANT === "konturas";

const MELYNA = KONTURAS ? 0x3D9BFF : 0x0080FF, ZALIA = KONTURAS ? 0x2ED27E : 0x00C664, NAVY = 0x291269, BALTA = 0xFFFFFF;   // konturas – šiek tiek šviesesnės
const BG = TAMSUS ? 0x2F4F3A : 0xF5F3ED;
const DURATION = 5.0;
const CAPTURE = new URLSearchParams(location.search).has("capture");

// ---- Renderer ----
const W = () => window.innerWidth, H = () => window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
// aplinkos žemėlapis duoda blizgius atspindžius ant navy ir disko
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = TAMSUS ? 0.28 : 0.3;

const camera = new THREE.PerspectiveCamera(30, W() / H(), 0.1, 200);

// ---- Medžiagos ----
const mat = {
  melyna: new THREE.MeshStandardMaterial({ color: MELYNA, roughness: 0.42, metalness: 0.05 }),
  zalia:  new THREE.MeshStandardMaterial({ color: ZALIA,  roughness: 0.42, metalness: 0.05 }),
  navy:   new THREE.MeshStandardMaterial({ color: NAVY,   roughness: 0.2,  metalness: 0.15 }),
  // tamsiame variante užrašas ratu – kreminis, nes navy ant tamsiai žalio fono nesiskaito
  raides: new THREE.MeshStandardMaterial({ color: 0xF5F3ED, roughness: 0.3, metalness: 0.1, emissive: 0xF5F3ED, emissiveIntensity: 0.06 }),
  balta:  new THREE.MeshStandardMaterial({ color: BALTA,  roughness: 0.4,  metalness: 0.0, emissive: 0xffffff, emissiveIntensity: TAMSUS ? 0.18 : 0.28 }),
  konturas: new THREE.MeshStandardMaterial({ color: NAVY, roughness: 0.2, metalness: 0.15, transparent: true, opacity: 1 }),   // atskira, kad galėtų išnykti/atsirasti
};

// ---- Emblema iš SVG ----
// 0 mėlyna, 1 žalia, 2 navy kontūras+rankena, 3 baltas kėbulas, 4 baltas stogelio ruožas, 5–6 balti ratai, 7–8 navy taškai, 9–10 V ir K
const layer = [
  { m: mat.melyna, z: 0.00,  d: 0.30, bevel: true  },
  { m: mat.zalia,  z: 0.012, d: 0.30, bevel: true  },
  { m: mat.navy,   z: 0.30,  d: 0.07, bevel: false },
  { m: mat.balta,  z: 0.32,  d: 0.07, bevel: false },
  { m: mat.balta,  z: 0.32,  d: 0.07, bevel: false },
  { m: mat.balta,  z: 0.32,  d: 0.07, bevel: false },
  { m: mat.balta,  z: 0.32,  d: 0.07, bevel: false },
  { m: mat.navy,   z: 0.40,  d: 0.05, bevel: false },
  { m: mat.navy,   z: 0.40,  d: 0.05, bevel: false },
  { m: mat.navy,   z: 0.40,  d: 0.05, bevel: false },
  { m: mat.navy,   z: 0.40,  d: 0.05, bevel: false },
];
// dalys surinkimo animacijai (indeksai pagal sluoksnius)
const PARTS = { diskas: [0, 1], konturas: [2], kebulas: [3, 4], ratasK: [5, 7], ratasD: [6, 8], vk: [9, 10] };

const svgData = new SVGLoader().parse(document.getElementById("logo-svg").textContent);
const SCALE = 1 / 100;
const CX = 297.636, CY = 420.945;

const coin = new THREE.Group();
const part = {};
for (const name of Object.keys(PARTS)) { part[name] = new THREE.Group(); coin.add(part[name]); }
const partOf = i => Object.keys(PARTS).find(k => PARTS[k].includes(i)) || "vk";

svgData.paths.forEach((p, i) => {
  const L = layer[i];
  SVGLoader.createShapes(p).forEach(shape => {
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: L.d / SCALE, curveSegments: 24,
      bevelEnabled: L.bevel, bevelThickness: 4, bevelSize: 3, bevelSegments: 4,
    });
    geo.translate(-CX, -CY, L.z / SCALE);
    geo.scale(SCALE, -SCALE, SCALE);
    const mesh = new THREE.Mesh(geo, i === 2 ? mat.konturas : L.m);
    mesh.castShadow = true; mesh.receiveShadow = true;
    part[partOf(i)].add(mesh);
  });
});
// ratų centrai (kad galėtų suktis apie savo ašį)
// PDF koordinatės y eina aukštyn, SVG transformacija jas apverčia (841.89 - y), o paskui mes apverčiame dar kartą
const svgY = yPdf => -((841.8898 - yPdf) - CY) * SCALE;
const WHEEL_L = new THREE.Vector3((250.4 - CX) * SCALE, svgY(303.7), 0);
const WHEEL_R = new THREE.Vector3((358.8 - CX) * SCALE, svgY(303.7), 0);
for (const [g, c] of [[part.ratasK, WHEEL_L], [part.ratasD, WHEEL_R]]) {
  g.children.forEach(m => m.geometry.translate(-c.x, -c.y, 0));
  g.position.copy(c);
}
scene.add(coin);

// ---- Užrašas ratu ----
const font = new FontLoader().parse(JSON.parse(document.getElementById("sriftas").textContent));
const TXT = "VEŽIMĖLIŲ KAMPELIS";
const SIZE = 0.62, TRACK = 0.07, R_TXT = KONTURAS ? 2.62 : 2.44, LETTER_D = 0.22;   // konturas – didesnis tarpas tarp disko ir raidžių
const adv = ch => (font.data.glyphs[ch] ? font.data.glyphs[ch].ha : font.data.glyphs["V"].ha) / font.data.resolution * SIZE + TRACK;
const total = [...TXT].reduce((s, ch) => s + adv(ch), 0) - TRACK;
const letters = [];
let along = 0;
[...TXT].forEach((ch, i) => {
  const a = adv(ch);
  const mid = along + (a - TRACK) / 2;
  along += a;
  if (ch === " ") return;
  const geo = new TextGeometry(ch, {
    font, size: SIZE, depth: LETTER_D, curveSegments: 12,
    bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.018, bevelSegments: 3,
  });
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  geo.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, 0);   // centras raidės viduryje
  const mesh = new THREE.Mesh(geo, TAMSUS ? mat.raides : mat.navy);
  mesh.castShadow = true;
  const theta = Math.PI / 2 + (total / 2 - mid) / R_TXT;
  const pivot = new THREE.Group();
  const rMid = R_TXT + (bb.max.y + bb.min.y) / 2;
  pivot.position.set(Math.cos(theta) * rMid, Math.sin(theta) * rMid, 0);
  pivot.rotation.z = theta - Math.PI / 2;
  pivot.add(mesh);
  coin.add(pivot);
  letters.push({ pivot, mesh, i: letters.length, theta });
});
const N_LET = letters.length;

// ---- Grindys ----
const box = new THREE.Box3().setFromObject(coin);
const floorY = box.min.y - 0.02;
let floor, mirror;
if (TAMSUS) {
  floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ color: 0x0b1a10, opacity: 0.35 }));   // grindys nematomos, matosi tik šešėlis ir atspindys
  // atspindys: apversta emblemos kopija po grindimis, permatoma
  mirror = coin.clone(true);
  mirror.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.26; o.castShadow = false; o.receiveShadow = false; } });
  mirror.scale.y = -1;
  scene.add(mirror);
} else {
  floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ color: 0x1a1030, opacity: 0.20 }));
}
floor.rotation.x = -Math.PI / 2; floor.position.y = floorY; floor.receiveShadow = true;
scene.add(floor);

// ---- Šviesos ----
scene.add(new THREE.HemisphereLight(0xffffff, TAMSUS ? 0x1c3325 : 0xd9d6cc, TAMSUS ? 0.9 : 1.3));
const key = new THREE.DirectionalLight(0xffffff, TAMSUS ? 2.8 : 2.4);
key.position.set(-8, 9, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 60;
const d = 9; key.shadow.camera.left = -d; key.shadow.camera.right = d; key.shadow.camera.top = d; key.shadow.camera.bottom = -d;
key.shadow.radius = 10; key.shadow.blurSamples = 24; key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(8, 3, 8); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(3, 6, -8); scene.add(rim);
// perbėganti šviesa (tik tamsiam variantui): siauras prožektorius, kuris nuslenka per emblemą
let sweep = null;
if (TAMSUS) {
  sweep = new THREE.SpotLight(0xfff3d6, 0, 40, 0.28, 0.6, 1.2);
  sweep.position.set(-6, 8, 9);
  sweep.target.position.set(0, 0, 0);
  scene.add(sweep, sweep.target);
  // švytėjimas fone
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
  g.addColorStop(0, "rgba(249,166,32,0.22)"); g.addColorStop(0.5, "rgba(249,166,32,0.06)"); g.addColorStop(1, "rgba(249,166,32,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.position.set(0, 0.2, -2.5); glow.scale.set(14, 14, 1);
  scene.add(glow);
}

// ---- Post-processing ----
const FxShader = {
  uniforms: { tDiffuse: { value: null }, aber: { value: 0 }, vig: { value: new THREE.Color(TAMSUS ? 0x142519 : 0xE6E2D6) }, vigAmt: { value: TAMSUS ? 1.0 : 0.8 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float aber; uniform vec3 vig; uniform float vigAmt; varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      vec2 off = c * aber;
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      float v = smoothstep(0.30, 1.0, length(c * vec2(1.0, 0.72)));
      col = mix(col, vig, v * vigAmt * (${TAMSUS ? "0.75" : "0.55"}));
      gl_FragColor = vec4(col, 1.0);
    }`,
};
let composer, fx;
function buildComposer() {
  const pr = renderer.getPixelRatio();
  const rt = new THREE.WebGLRenderTarget(W() * pr, H() * pr, { samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  if (TAMSUS) composer.addPass(new UnrealBloomPass(new THREE.Vector2(W(), H()), 0.12, 0.5, 0.8));
  fx = new ShaderPass(FxShader);
  composer.addPass(fx);
  composer.addPass(new OutputPass());
}

// ---- Kamera ----
let camDist = 20;
function frameCamera() {
  const aspect = W() / H();
  camera.aspect = aspect;
  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  const wantWidth = (R_TXT + SIZE + 0.2) * 2 * 1.08;
  camDist = wantWidth / (2 * Math.tan(fovRad / 2) * aspect);
  camera.updateProjectionMatrix();
}

// ---- Animacija ----
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutBounce = x => { const n1 = 7.5625, d1 = 2.75; if (x < 1 / d1) return n1 * x * x; if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75; if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375; return n1 * (x -= 2.625 / d1) * x + 0.984375; };
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const L = THREE.MathUtils.lerp;
const parasas = document.getElementById("parasas");

function resetParts() {
  for (const g of Object.values(part)) { g.rotation.set(0, 0, 0); g.scale.set(1, 1, 1); }
  part.diskas.position.set(0, 0, 0); part.kebulas.position.set(0, 0, 0); part.konturas.position.set(0, 0, 0); part.vk.position.set(0, 0, 0);
  mat.konturas.opacity = 1;
  part.ratasK.position.copy(WHEEL_L); part.ratasD.position.copy(WHEEL_R);
}

function setTamsus(t) {
  // emblema atsisuka kaip moneta: iš toli ir maža → sukasi → sustoja priekiu
  const p = easeOutCubic(seg(t, 0, 2.4));
  coin.position.set(0, L(0.6, 0, p), L(-6, 0, p));
  coin.rotation.set(L(0.25, 0, p), L(-4.2, 0, p), 0);
  const s = L(0.35, 1, p); coin.scale.set(s, s, s);
  // po sustojimo lengvai kvėpuoja
  const idle = seg(t, 2.4, 5);
  coin.rotation.y += Math.sin(idle * Math.PI * 1.2) * 0.07;
  coin.position.y += Math.sin(idle * Math.PI * 1.6) * 0.04;

  // raidės išnyra paeiliui pagal ratą, su lengvu „šoktelėjimu"
  letters.forEach(({ mesh, i }) => {
    const start = 1.3 + i * 0.055;
    const q = seg(t, start, start + 0.4);
    const k = q === 0 ? 0 : easeOutBack(q);
    mesh.scale.set(Math.max(k, 0.001), Math.max(k, 0.001), Math.max(k, 0.001));
    mesh.position.z = (1 - q) * 0.6;
    mesh.rotation.x = (1 - q) * 1.2;
  });

  // šviesos perbėgimas per emblemą 2.6–3.6 s
  const sw = seg(t, 2.6, 3.7);
  sweep.intensity = Math.sin(sw * Math.PI) * 260;
  sweep.position.set(L(-9, 9, sw), 8, 9);
  sweep.target.position.set(L(-6, 6, sw), 0, 0);

  camera.position.set(0, L(-1.2, 0.5, easeInOut(seg(t, 0, 2.8))), camDist);
  camera.lookAt(0, 0.1, 0);
  fx.uniforms.aber.value = 0.008 * (1 - easeOutCubic(seg(t, 0, 2.0)));
  parasas.style.opacity = easeInOut(seg(t, 3.4, 4.0)).toFixed(3);
  syncMirror();
}

// atspindys kartoja kiekvieno emblemos elemento padėtį (struktūra identiška, nes tai klonas)
function syncMirror() {
  if (!mirror) return;
  const walk = (a, b) => {
    for (let i = 0; i < a.children.length; i++) {
      const x = a.children[i], y = b.children[i];
      y.position.copy(x.position); y.rotation.copy(x.rotation); y.scale.copy(x.scale);
      walk(x, y);
    }
  };
  walk(coin, mirror);
  mirror.position.set(coin.position.x, 2 * floorY - coin.position.y, coin.position.z);
  mirror.rotation.set(-coin.rotation.x, coin.rotation.y, -coin.rotation.z);
  mirror.scale.set(coin.scale.x, -coin.scale.y, coin.scale.z);
}

function setSurinkimas(t) {
  resetParts();
  // 1) diskas nukrenta iš viršaus ir šokteli (0–1.0 s)
  const a = seg(t, 0, 1.0);
  part.diskas.position.y = (1 - easeOutBounce(a)) * 9;
  part.diskas.rotation.y = (1 - easeOutCubic(a)) * 1.2;
  // 2) vežimėlio kėbulas iškyla iš disko (0.9–1.5 s)
  const b = seg(t, 0.9, 1.5);
  const bs = b === 0 ? 0.001 : easeOutBack(b);
  part.kebulas.scale.set(bs, bs, 1); part.kebulas.position.z = -0.4 * (1 - b);
  part.konturas.scale.copy(part.kebulas.scale); part.konturas.position.copy(part.kebulas.position);
  // 3) ratai atrieda iš šonų (1.3–2.0 s)
  const c = easeOutCubic(seg(t, 0.8, 1.5));   // kartu su kėbulu, kad nesimatytų tuščių ratų vietų
  part.ratasK.position.x = WHEEL_L.x - 4.5 * (1 - c); part.ratasK.rotation.z = (1 - c) * 6;
  part.ratasD.position.x = WHEEL_R.x + 4.5 * (1 - c); part.ratasD.rotation.z = -(1 - c) * 6;
  part.ratasK.position.z = part.ratasD.position.z = 0.25 * (1 - c);
  // 4) VK įšoka (1.9–2.3 s)
  const v = seg(t, 1.9, 2.3);
  const vs = v === 0 ? 0.001 : easeOutBack(v);
  part.vk.scale.set(vs, vs, 1); part.vk.position.z = 1.2 * (1 - v);
  // 5) raidės ratu – paeiliui iš kairės į dešinę (2.1–3.3 s)
  letters.forEach(({ mesh, i }) => {
    const start = 2.1 + i * 0.06;
    const q = seg(t, start, start + 0.35);
    const k = q === 0 ? 0.001 : easeOutBack(q);
    mesh.scale.set(k, k, k);
    mesh.position.z = (1 - q) * 0.8;
  });
  // 6) visa emblema lėtai pasisuka, kad matytųsi gylis (3.2–5 s)
  const r = easeInOut(seg(t, 3.2, 5.0));
  coin.rotation.y = Math.sin(r * Math.PI) * 0.42;
  coin.rotation.x = Math.sin(r * Math.PI) * -0.10;

  camera.position.set(0, L(0.2, 0.5, easeInOut(seg(t, 0, 3))), camDist);
  camera.lookAt(0, 0.1, 0);
  fx.uniforms.aber.value = 0;
  parasas.style.opacity = easeInOut(seg(t, 3.5, 4.1)).toFixed(3);
}

function setKonturas(t) {
  resetParts();
  // 1) vežimėlio kontūras išnyra iš nieko (0–0.7 s): permatomumas + lengvas „šoktelėjimas"
  const a = seg(t, 0.05, 0.7);
  mat.konturas.opacity = easeOutCubic(a);
  const as = a === 0 ? 0.001 : L(0.75, 1, easeOutBack(a));
  part.konturas.scale.set(as, as, 1);
  // 2) baltas užpildas, ratai ir VK atsiranda kartu su kontūru – kad vežimėlis nuo pat pradžių atrodytų kaip piešinys linija
  const b = a;
  const bs = b === 0 ? 0.001 : as;
  part.kebulas.scale.set(bs, bs, 1);
  part.ratasK.scale.set(bs, bs, 1); part.ratasD.scale.set(bs, bs, 1);
  part.ratasK.rotation.z = (1 - easeOutCubic(b)) * 2; part.ratasD.rotation.z = -(1 - easeOutCubic(b)) * 2;
  part.vk.scale.set(bs, bs, 1);
  // 3) diskas išauga už vežimėlio (1.1–1.9 s), pasisukdamas kaip moneta
  const c = seg(t, 1.1, 1.9);
  const cs = c === 0 ? 0.001 : easeOutBack(c);
  part.diskas.scale.set(cs, cs, 1);
  part.diskas.rotation.y = (1 - easeOutCubic(c)) * 1.4;
  part.diskas.position.z = -0.6 * (1 - easeOutCubic(c));
  // 4) užrašas ratu – raidės paeiliui (2.0–3.2 s)
  letters.forEach(({ mesh, i }) => {
    const start = 2.0 + i * 0.06;
    const q = seg(t, start, start + 0.35);
    const k = q === 0 ? 0.001 : easeOutBack(q);
    mesh.scale.set(k, k, k);
    mesh.position.z = (1 - q) * 0.8;
  });
  // 5) pabaigoje lėtas pasisukimas, kad matytųsi gylis (3.3–5 s)
  const r = easeInOut(seg(t, 3.3, 5.0));
  coin.rotation.y = Math.sin(r * Math.PI) * 0.35;
  coin.rotation.x = Math.sin(r * Math.PI) * -0.08;

  camera.position.set(0, L(0.3, 0.5, easeInOut(seg(t, 0, 3))), camDist);
  camera.lookAt(0, 0.1, 0);
  fx.uniforms.aber.value = 0;
  parasas.style.opacity = easeInOut(seg(t, 3.5, 4.1)).toFixed(3);
}

const setState = TAMSUS ? setTamsus : (KONTURAS ? setKonturas : setSurinkimas);

function onResize() { renderer.setSize(W(), H()); buildComposer(); frameCamera(); }
window.addEventListener("resize", onResize);
onResize();

window.__renderAt = (t) => { setState(t); composer.render(); return true; };
window.__DURATION = DURATION;

if (!CAPTURE) {
  let t0 = performance.now();
  (function loop() {
    const t = ((performance.now() - t0) / 1000) % (DURATION + 1.0);
    window.__renderAt(Math.min(t, DURATION));
    requestAnimationFrame(loop);
  })();
} else {
  window.__renderAt(0);
  window.__READY = true;
}
</script>
</body>
</html>
